name: Publish static demo

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish-static-demo.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download demo HTML
        run: |
          curl -L --fail --retry 3 --retry-delay 5 "https://litter.catbox.moe/jf4dz8.html" -o index.html
          test -s index.html
          grep -q "PAUZA_STEP_DATA" index.html
          touch .nojekyll

      - name: Commit demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Publish Pauza static demo"
            git push
          fi
